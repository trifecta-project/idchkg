[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idchkg"
version = "0.1.0"
description = "Local, LLM-based knowledge graph pipeline with built-in judges, inspired by 'Unflattening Knowledge Graphs' (van Erp, K-CAP 2023)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.100"]
dev = ["pytest>=7"]

[project.scripts]
idchkg = "idchkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
